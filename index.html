<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Certificate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        'g-blue': '#4285F4',
                        'g-red': '#EA4335',
                        'g-yellow': '#FBBC05',
                        'g-green': '#34A853',
                        'g-gray': '#F8F9FA'
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8F9FA; color: #202124; }
        .google-card {
            background: white;
            border: 1px solid #DADCE0;
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .google-card:hover {
            box-shadow: 0 10px 25px rgba(60,64,67,0.15);
            transform: translateY(-8px);
            border-color: transparent;
        }
        .search-container:focus-within {
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.2);
            border-color: #4285F4;
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center bg-g-blue text-white font-bold text-sm">G</div>
                <span class="font-medium text-gray-800">Ambassador Portal</span>
            </div>
        </div>
    </nav>

    <main class="py-16 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="text-center mb-16">
                <div class="flex justify-center gap-2 mb-6 opacity-0 animate-fade-in-up" style="animation-delay: 0.1s">
                    <div class="w-3 h-3 rounded-full bg-g-blue"></div>
                    <div class="w-3 h-3 rounded-full bg-g-red"></div>
                    <div class="w-3 h-3 rounded-full bg-g-yellow"></div>
                    <div class="w-3 h-3 rounded-full bg-g-green"></div>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 opacity-0 animate-fade-in-up" style="animation-delay: 0.2s">Certificate Center</h1>
            </div>

            <div class="search-container relative max-w-xl mx-auto mb-16 bg-white border border-gray-300 rounded-full flex items-center p-2 transition-all opacity-0 animate-fade-in-up" style="animation-delay: 0.3s">
                <i class="ph ph-magnifying-glass text-gray-400 text-xl pl-4"></i>
                <input type="text" id="public-search" class="w-full px-4 py-3 outline-none bg-transparent" placeholder="Search your name...">
            </div>

            <section class="mb-16">
                <h2 class="text-xl font-bold mb-8 text-gray-800 flex items-center gap-2">
                    <i class="ph-fill ph-star text-g-yellow"></i> Top Participants
                </h2>
                <div id="public-top-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <section>
                <h2 class="text-xl font-bold mb-8 text-gray-800 flex items-center gap-2">
                    <i class="ph-fill ph-users text-g-blue"></i> Event Participants
                </h2>
                <div id="public-gen-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
            </section>
        </div>
    </main>

    <script>
        const topParticipants = [{ id: 'T1', name: 'Bharath HM', track: 'Prompt creation', award: 'Top Prompt Creator' }, { id: 'T2', name: 'N suriya harsha', track: 'Prompt creation', award: 'Top Prompt Creator' }];
        const generalParticipants = [{ id: 'G1', name: 'Kushal kambar', track: 'Prompt creation' }, { id: 'G2', name: 'Manoj', track: 'Prompt creation' }, { id: 'G3', name: 'Naresh MS', track: 'Prompt creation' }, { id: 'G4', name: 'Harshith', track: 'Prompt creation' }, { id: 'G5', name: 'Amodh', track: 'Prompt creation' }];

        function render() {
            const search = document.getElementById('public-search').value.toLowerCase();
            document.getElementById('public-top-container').innerHTML = topParticipants.filter(p => p.name.toLowerCase().includes(search)).map((p, i) => participantCard(p, 'top', i)).join('');
            document.getElementById('public-gen-container').innerHTML = generalParticipants.filter(p => p.name.toLowerCase().includes(search)).map((p, i) => participantCard(p, 'general', i)).join('');
        }

        function participantCard(p, type, index) {
            return `
                <div class="google-card p-6 opacity-0 animate-fade-in-up" style="animation-delay: ${0.4 + (index * 0.1)}s">
                    <h3 class="font-bold text-gray-900">${p.name}</h3>
                    <p class="text-[10px] font-bold text-g-blue uppercase tracking-widest mb-6">${type === 'top' ? p.award : p.track}</p>
                    <div class="flex gap-2">
                        <button onclick="handleCert('${p.id}', '${type}', 'download')" class="flex-1 py-2 bg-g-gray hover:bg-gray-200 rounded-lg text-xs font-bold transition-all active:scale-95">Save</button>
                        <button onclick="handleCert('${p.id}', '${type}', 'print')" class="flex-1 py-2 bg-g-blue hover:bg-blue-600 text-white rounded-lg text-xs font-bold shadow-lg shadow-blue-200 transition-all active:scale-95">Print</button>
                    </div>
                </div>
            `;
        }

        document.getElementById('public-search').addEventListener('input', render);
        render();

        window.handleCert = (id, type, action) => {
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.5 }, colors: ['#4285F4', '#EA4335', '#FBBC05', '#34A853'] });

            const list = type === 'top' ? topParticipants : generalParticipants;
            const cert = list.find(c => c.id === id);

            const canvas = document.createElement('canvas');
            canvas.width = 1600; canvas.height = 1200;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center"; ctx.fillStyle = "#202124";
            ctx.font = `bold 80px 'Poppins'`;
            ctx.fillText(cert.name, 800, 600);

            const dataUrl = canvas.toDataURL('image/png');
            if (action === 'download') { const a = document.createElement('a'); a.href = dataUrl; a.download = `${cert.name}_Certificate.png`; a.click(); }
            else { const win = window.open(); win.document.write(`<img src="${dataUrl}" style="width:100%"/>`); setTimeout(() => { win.print(); }, 500); }
        };
    </script>
</body>
</html>
